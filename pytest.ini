[pytest]
# Canonical run:  python -m pytest -q
# Fast subset:    python -m pytest -q -m "not slow"
#
# Several test modules also run standalone (python <file>) for interactive debugging, which
# is why they keep their own sys.path bootstrap rather than relying on this file.

testpaths =
    geometry/tests
    sensor/tests
    physics/tests
    stages/tests
    registration/tests
    MM_Optimizer/tests

markers =
    slow: raycast / MuJoCo physics / sensor-sim tests, minutes not seconds

filterwarnings =
    default
    # Optuna APIs this project uses on purpose; the notice is not actionable here.
    # ExperimentalWarning derives from Warning directly, not UserWarning.
    ignore::optuna.exceptions.ExperimentalWarning
    # CuPy probes for CUDA and reports its absence; the GPU path is optional by design.
    ignore:.*CUDA path could not be detected.*:UserWarning
