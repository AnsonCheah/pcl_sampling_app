name: autotune
channels:
  - defaults
dependencies:
  - python=3.12.13
  - pip=26.0.1
  - pip:
      - numpy==2.4.1
      - open3d==0.19.0
      - scipy==1.16.3
      - optuna==4.8.0
      # PyTorch (CPU build) — backend for Optuna's GPSampler, i.e. the 'gp' joint-study
      # sampler in MM_Optimizer/optuna_optimizer.py. GPSampler pins its GP math to CPU
      # (torch.device("cpu")), so the CPU wheel is sufficient; a CUDA build would sit idle
      # for the sampler and add Blackwell/sm_120 wheel friction. NSGA-II and TPE need no torch.
      # The +cpu local tag is served from the PyTorch CPU index, not PyPI.
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.13.0+cpu
      - scikit-learn==1.8.0
      - matplotlib==3.10.8
      - trimesh==4.11.0
      - mujoco==3.5.0
      - mujoco-python-viewer==0.1.4
      - python-fcl==0.7.0.10
      - vhacdx==0.0.10
      - networkx==3.6.1
      - manifold3d==3.4.1
      # Tray pocket geometry (geometry/tray_utils.py): shapely = footprint silhouette + buffer
      # smoothing/clearance; mapbox-earcut = polygon triangulation behind trimesh.extrude_polygon.
      - shapely==2.1.2
      - mapbox-earcut==2.0.0
      - rtree==1.4.1
      - grpcio==1.80.0
      - rich==14.3.3
      # MechMind Vision Hub gRPC client — standalone private package (was vendored under mm_adapter/).
      # Consume pinned by tag; for local co-development use `pip install -e ../mm-adapter`.
      - mm-adapter @ git+https://github.com/AnsonCheah/mm-adapter.git@v0.1.0
      # Optional GPU acceleration for sensor/segment_instances.py (cupyx.scipy.ndimage).
      # Absent/unsupported GPU -> code falls back to SciPy/NumPy automatically.
      # cupy-cuda12x requires a CUDA 12.x driver (12.8+ for Blackwell / sm_120).
      - cupy-cuda12x[ctk]>=13.4.0