name: autotune
channels:
  - defaults
dependencies:
  - python=3.12.13
  - pip=26.0.1
  - pip:
      - numpy==2.4.1
      - open3d==0.19.0
      - scipy==1.16.3
      - optuna==4.8.0
      - scikit-learn==1.8.0
      - matplotlib==3.10.8
      - trimesh==4.11.0
      - mujoco==3.5.0
      - mujoco-python-viewer==0.1.4
      - python-fcl==0.7.0.10
      - vhacdx==0.0.10
      - networkx==3.6.1
      - manifold3d==3.4.1
      - grpcio==1.80.0
      - rich==14.3.3
      # Optional GPU acceleration for sensor/segment_instances.py (cupyx.scipy.ndimage).
      # Absent/unsupported GPU -> code falls back to SciPy/NumPy automatically.
      # cupy-cuda12x requires a CUDA 12.x driver (12.8+ for Blackwell / sm_120).
      - cupy-cuda12x[ctk]>=13.4.0